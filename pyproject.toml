[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlmeter"
version = "0.2.2"
description = "Multimodal LLM accuracy × cost meter: evaluate vision-language models (scene checks / classification / VQA) on your own data, with accuracy-vs-cost comparison reports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "flybear16" }]
keywords = ["multimodal", "vision-language", "evaluation", "benchmark", "llm", "cost"]
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pillow>=10.0",
    "tqdm>=4.66",
]

[project.scripts]
vlmeter = "vlmeter.cli:main"

[tool.setuptools.packages.find]
include = ["vlmeter*"]

[tool.setuptools.package-data]
vlmeter = ["config/*.yaml"]
