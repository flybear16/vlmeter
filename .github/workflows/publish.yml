name: Publish to PyPI

on:
  workflow_dispatch: # 手动触发；本地 twine（token）为主发布通道

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)，无需长期 token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
